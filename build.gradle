plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.10.0'
}

group = 'com.queue'
version = '0.0.1-SNAPSHOT'
description = 'Distributed Priority Queue'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// gRPC and protobuf versions come from the Spring Boot BOM, which also moves the gRPC that jetcd
// brings in onto the same version. The code generators below must match those versions.
def managedVersions = dependencyManagement.importedProperties

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.etcd:jetcd-core:0.8.7'
    // Shaded: bundles the Netty that gRPC is tested with, independent of the Netty Spring Boot manages.
    implementation 'io.grpc:grpc-netty-shaded'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.awaitility:awaitility'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${managedVersions['protobuf-java.version']}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${managedVersions['grpc-java.version']}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

springBoot {
    mainClass = 'com.queue.distributedpriorityqueue.DistributedPriorityQueueApplication'
}

tasks.register('harness', JavaExec) {
    group = 'application'
    description = 'Runs producers and consumers against a running broker and checks nothing was lost.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.queue.distributedpriorityqueue.demo.QueueHarness'
}

tasks.named('test') {
    useJUnitPlatform()
}
